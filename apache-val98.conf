# Sätt Perl att hitta cgi-lib.pl, common.pl, schema.pl via relativa require
SetEnv PERL5LIB /usr/lib/cgi-bin/val98

# Servera bilder som statiska filer (inte som CGI)
<Directory "/usr/lib/cgi-bin/val98/images">
    Options -ExecCGI
    SetHandler default-handler
    Require all granted
</Directory>
